<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>AUT-1363 Smoke Page</title>
  </head>
  <body>
    <main>
      <h1>AUT-1363 smoke page</h1>
      <section aria-label="Checkout summary">
        <h2>Checkout</h2>
        <p id="cart-total">Cart total: $42.00</p>
        <button id="start-checkout">Start checkout</button>
        <button id="apply-discount">Apply discount</button>
      </section>

      <section aria-label="Customer profile">
        <h2>Customer profile</h2>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" placeholder="customer@example.com">
        <label for="delivery-date">Delivery date</label>
        <input id="delivery-date" name="delivery-date" type="date">
        <button id="save-profile">Save profile</button>
      </section>
    </main>
  </body>
</html>
